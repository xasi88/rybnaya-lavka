<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Рыбная лавка · Каталог и заказ в WhatsApp</title>
  <meta name="description" content="Каталог «Рыбная лавка», Грозный: икра, юкола, вяленая рыба, крабы, креветки, чинары. Соберите заказ и отправьте его в WhatsApp лавки.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f0f0f">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Рыбная лавка · Каталог и заказ в WhatsApp">
  <meta property="og:description" content="Все товары с ценами. Соберите заказ и отправьте его в WhatsApp лавки.">
  <meta property="og:image" content="img/logo-512.png">

  <link rel="icon" href="img/logo-512.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Рыбная лавка">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <noscript>
    <p class="noscript">Для корзины включите JavaScript. Заказ: <a href="https://wa.me/79637016060">WhatsApp 8 (963) 701-60-60</a>.</p>
  </noscript>
  <header class="appbar">
    <div class="appbar-in">
      <a class="brand" href="#menu" aria-label="Рыбная лавка, каталог">
        <span class="brand-mark" id="brandMark"></span>
        <span class="brand-text"><b>Рыбная лавка</b><span class="brand-sub">Грозный · каталог</span></span>
      </a>
      <nav class="tools" aria-label="Разделы">
        <a class="tool" href="#search" data-go="search" aria-label="Поиск товара"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></a>
        <a class="tool" href="#cafe" data-go="cafe" aria-label="О лавке: адрес и телефон"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></a>
      </nav>
    </div>
  </header>

  <main class="app">
    <section class="view" id="view-menu" data-view="menu" aria-label="Каталог">
      <div class="menu-layout">
        <div class="menu-main">
          <div class="intro" id="intro"></div>
          <nav class="chips" id="chips" aria-label="Разделы каталога"><div class="chips-track" id="chipsTrack"><span class="chips-pill" id="chipsPill"></span></div></nav>
          <div id="groups"></div>
          <p class="price-note" id="priceNote"></p>
        </div>
        <aside class="side-order" id="sideOrder" aria-label="Ваш заказ"></aside>
      </div>
    </section>

    <section class="view" id="view-search" data-view="search" aria-label="Поиск" hidden>
      <div class="page">
        <a class="back" href="#menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Каталог</a>
        <h2 class="page-title">Поиск</h2>
        <label class="searchbox">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" placeholder="Икра, юкола, креветки…" autocomplete="off" enterkeyhint="search" aria-label="Найти товар">
          <button type="button" class="clear" id="qClear" aria-label="Очистить" hidden>×</button>
        </label>
        <div class="quick" id="quick"></div>
        <div class="results" id="results"></div>
      </div>
    </section>

    <section class="view" id="view-order" data-view="order" aria-label="Заказ" hidden>
      <div class="page" id="orderPage"></div>
    </section>

    <section class="view" id="view-cafe" data-view="cafe" aria-label="О лавке" hidden>
      <div class="page" id="cafePage"></div>
    </section>
  </main>

  <a class="cartbar" id="cartbar" href="#order" aria-label="Открыть корзину">
    <span class="cb-bag" id="cartbarBag"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><i id="cartbarCount">0</i></span>
    <span class="cb-text">Корзина, примерно<b class="cb-sum" id="cartbarSum">0 ₽</b></span>
    <span class="cb-go">Оформить<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span>
  </a>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-bg" data-close></div>
    <article class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="dName" tabindex="-1">
      <button class="sheet-x" type="button" data-close aria-label="Закрыть">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="d-art" id="dArt"></div>
      <div class="d-body">
        <p class="d-meta" id="dMeta"></p>
        <h2 class="d-name" id="dName">Товар</h2>
        <p class="d-sum" id="dSum"></p>
        <div class="d-buy"><b class="d-price" id="dPrice"></b><div id="dCtl" data-ctl-big></div></div>
      </div>
    </article>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <span class="flyer" id="flyer" aria-hidden="true"></span>

  <script src="data/menu.js"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/zakaz.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/order.js"></script>
  <script src="js/version.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
